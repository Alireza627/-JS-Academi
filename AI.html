<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Academi JS | AI Ultra</title>

  <!-- Bootstrap -->
  <link href="./assets/bootstrap-5.3.8-dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

<link href="./AI/styles.css" rel="stylesheet">
</head>

<body>
  
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-8">
        <div class="main-card p-4 mt-5">
          <div class="bot-avatar"><i class="bi bi-robot"></i></div>
          <h4 class="text-center fw-bold mb-1 text-primary">هوش مصنوعی Academi JS</h4>
          <p class="text-center text-muted small mb-4">AI Ultra </p>

          <div id="chatWindow" class="d-flex flex-column">
            <div class="bubble ai-msg">
              <p>سلام! 👋<br>چه کمکی از دستم بر میاد؟</p>
            </div>
          </div>

          <div id="typing" class="text-center my-3 text-primary small" style="display:none;">
            <span class="spinner-border spinner-border-sm me-1"></span> در حال نوشتن پاسخ...
          </div>

          <div class="input-group-custom d-flex mt-3">
            <input type="text" id="userInput" class="form-control"
              placeholder="مثلاً: یک ماشین حساب با جاوااسکریپت بساز..." />
            <button class="btn btn-primary px-4" id="sendBtn">
              ارسال <i class="bi bi-send ms-1"></i>
            </button>
          </div>

          <div class="d-flex justify-content-end mt-2">
            <button class="btn btn-outline-primary btn-sm" id="clearChat">
              🗑 پاک‌سازی گفتگو
            </button>
            <button class="btn btn-outline-primary btn-sm" id="clearChat"><a href="./index.html"> بازگشت</a>
            
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Main JS -->
  <script src="./AI/main.js"></script>
</body>
</html>
